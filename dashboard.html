<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم mojz - الكابتشا</title>
    <style>
        body { font-family: system-ui; background: #f0f2f5; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>إعدادات الـ API والكابتشا</h2>
        
        <div class="form-group">
            <label>رابط الـ API للبحث:</label>
            <input type="url" id="targetUrl" placeholder="https://example.com/api/search">
        </div>

        <div class="form-group">
            <label>رابط صورة الكابتشا (Captcha Image URL):</label>
            <input type="url" id="captchaUrl" placeholder="https://example.com/api/captcha-image">
        </div>

        <div class="form-group">
            <label>نوع الطلب:</label>
            <select id="method"><option value="POST">POST</option><option value="GET">GET</option></select>
        </div>

        <div class="form-group">
            <label>اسم حقل الهاتف في الـ API الأصلي:</label>
            <input type="text" id="targetPhoneField" placeholder="مثال: phone">
        </div>

        <div class="form-group">
            <label>اسم حقل الكابتشا في الـ API الأصلي:</label>
            <input type="text" id="targetCaptchaField" placeholder="مثال: captcha_code">
        </div>

        <div class="form-group">
            <label>الترويسات (Headers JSON):</label>
            <textarea id="headers" rows="4"></textarea>
        </div>

        <button onclick="saveSettings()">حفظ التغييرات</button>
    </div>

    <script>
        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            document.getElementById('targetUrl').value = data.targetUrl || '';
            document.getElementById('captchaUrl').value = data.captchaUrl || '';
            document.getElementById('method').value = data.method || 'POST';
            document.getElementById('targetPhoneField').value = data.targetPhoneField || '';
            document.getElementById('targetCaptchaField').value = data.targetCaptchaField || '';
            document.getElementById('headers').value = JSON.stringify(data.headers || {}, null, 2);
        }

        async function saveSettings() {
            const payload = {
                targetUrl: document.getElementById('targetUrl').value,
                captchaUrl: document.getElementById('captchaUrl').value,
                method: document.getElementById('method').value,
                targetPhoneField: document.getElementById('targetPhoneField').value,
                targetCaptchaField: document.getElementById('targetCaptchaField').value,
                headers: JSON.parse(document.getElementById('headers').value || '{}')
            };

            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert('تم الحفظ!');
        }
        loadSettings();
    </script>
</body>
</html>
