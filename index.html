<script>
    let currentPhone = '';
    let currentSessionCookie = ''; // متغير لحفظ الكوكي الخاصة بالطلب

    async function startSearch(e) {
        e.preventDefault();

        currentPhone = document.getElementById('phoneNumber').value.trim();
        if (!currentPhone) return;

        const statusMsg = document.getElementById('statusMsg');
        const resultContainer = document.getElementById('resultContainer');
        const submitBtn = document.getElementById('submitBtn');

        resultContainer.style.display = 'none';
        statusMsg.className = 'status-msg status-loading';
        statusMsg.innerText = 'جاري الاتصال بالموقع الأصلي...';
        statusMsg.style.display = 'block';
        submitBtn.disabled = true;

        await sendRequest({ phoneNumber: currentPhone });
    }

    async function sendRequest(payload) {
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        try {
            const res = await fetch('/api/proxy-search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            // إذا أرجع السيرفر كابتشا ورابط كوكي، نحفظ الكوكي في المتغير
            if (result.requireCaptcha) {
                statusMsg.style.display = 'none';
                if (result.sessionCookie) {
                    currentSessionCookie = result.sessionCookie;
                }
                document.getElementById('modalCaptchaImg').src = result.captchaImage;
                document.getElementById('captchaModal').style.display = 'flex';
            } 
            else if (result.success) {
                closeCaptchaModal();
                statusMsg.style.display = 'none';
                document.getElementById('jsonResult').innerText = JSON.stringify(result.data, null, 2);
                document.getElementById('resultContainer').style.display = 'block';
                submitBtn.disabled = false;
            } 
            else {
                closeCaptchaModal();
                statusMsg.className = 'status-msg status-error';
                statusMsg.innerText = result.message || 'فشل جلب النتائج';
                submitBtn.disabled = false;
            }
        } catch (err) {
            closeCaptchaModal();
            statusMsg.className = 'status-msg status-error';
            statusMsg.innerText = 'حدث خطأ في الاتصال بالسيرفر الوسيط';
            submitBtn.disabled = false;
        }
    }

    async function submitCaptcha() {
        const captchaCode = document.getElementById('modalCaptchaInput').value.trim();
        if (!captchaCode) {
            alert('يرجى إدخال رمز الكابتشا أولاً');
            return;
        }

        closeCaptchaModal();
        
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.className = 'status-msg status-loading';
        statusMsg.innerText = 'جاري التحقق وتنفيذ الطلب بنفس الجلسة...';
        statusMsg.style.display = 'block';

        // إرسال الرقم + الكابتشا + الكوكي التي جاءت مع الصورة
        await sendRequest({
            phoneNumber: currentPhone,
            captchaCode: captchaCode,
            sessionCookie: currentSessionCookie
        });

        document.getElementById('modalCaptchaInput').value = '';
    }

    function closeCaptchaModal() {
        document.getElementById('captchaModal').style.display = 'none';
    }
</script>
