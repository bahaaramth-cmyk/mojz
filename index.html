<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام موجز - موثق وسريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
        .mojaz-primary {
            background-color: #0f766e;
        }
        .mojaz-primary:hover {
            background-color: #115e59;
        }
        .mojaz-text {
            color: #0f766e;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg mojaz-primary text-white flex items-center justify-center font-bold text-xl shadow-md">
                    م
                </div>
                <div>
                    <h1 class="font-extrabold text-xl text-slate-900 tracking-tight">موجز</h1>
                    <p class="text-xs text-slate-500">تقرير السيارات المستعملة</p>
                </div>
            </div>
            <div>
                <a href="/dashboard" class="text-sm font-semibold text-slate-600 hover:mojaz-text transition">لوحة التحكم</a>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 space-y-6">
            
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold text-slate-900">ابحث عن تقرير مركبة</h2>
                <p class="text-sm text-slate-500">أدخل الرقم التسلسلي للمركبة للاستعلام الفوري</p>
            </div>

            <form id="searchForm" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">الرقم التسلسلي / رقم الهيكل</label>
                    <input type="text" id="sequenceNumber" required placeholder="مثال: JTB11UJ80V6003567" 
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-left placeholder:text-right transition outline-none">
                </div>

                <div id="captchaSection" class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="block text-sm font-semibold text-slate-700">رمز التحقق (الكابتشا)</label>
                    <div class="flex items-center gap-3">
                        <div class="flex-1 bg-white border border-slate-200 rounded-lg overflow-hidden h-12 flex items-center justify-center shadow-inner">
                            <img id="captchaImage" src="" alt="جاري تحميل الكابتشا..." class="h-full object-contain">
                        </div>
                        <button type="button" id="refreshCaptchaBtn" class="px-3 py-2 text-xs font-semibold mojaz-text bg-white border border-teal-200 rounded-lg shadow-sm hover:bg-teal-50">
                            تحديث 🔄
                        </button>
                    </div>
                    <input type="text" id="captchaInput" placeholder="أدخل الأرقام الظاهرة" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-center text-lg font-bold tracking-widest outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 mojaz-primary text-white font-bold rounded-xl shadow-lg shadow-teal-700/20 hover:shadow-teal-700/30 transition duration-200 text-base">
                    استعلام عن التقرير
                </button>
            </form>

            <div id="resultBox" class="hidden p-4 rounded-xl text-sm leading-relaxed"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة © 2026 | بوابة الاستعلام السريع
    </footer>

    <script>
        let sessionCookie = '';
        let captchaUuid = '';

        const searchForm = document.getElementById('searchForm');
        const sequenceInput = document.getElementById('sequenceNumber');
        const captchaInput = document.getElementById('captchaInput');
        const captchaImage = document.getElementById('captchaImage');
        const refreshBtn = document.getElementById('refreshCaptchaBtn');
        const resultBox = document.getElementById('resultBox');
        const submitBtn = document.getElementById('submitBtn');

        // دالة جلب الكابتشا
        async function fetchCaptcha() {
            captchaImage.src = '';
            captchaImage.alt = 'جاري التحميل...';
            try {
                const response = await fetch('/api/proxy-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();
                
                if (data.requireCaptcha) {
                    captchaImage.src = data.captchaImage;
                    sessionCookie = data.sessionCookie || '';
                    captchaUuid = data.captchaUuid || '';
                }
            } catch (err) {
                captchaImage.alt = 'فشل جلب الصورة';
            }
        }

        // جلب الكابتشا عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', fetchCaptcha);
        refreshBtn.addEventListener('click', fetchCaptcha);

        // إرسال طلب الاستعلام
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الاستعلام...';
            resultBox.classList.add('hidden');

            try {
                const response = await fetch('/api/proxy-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: sequenceInput.value.trim(),
                        captchaCode: captchaInput.value.trim(),
                        sessionCookie: sessionCookie,
                        captchaUuid: captchaUuid
                    })
                });

                const resData = await response.json();

                resultBox.classList.remove('hidden');

                if (resData.success) {
                    resultBox.className = 'p-4 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-200';
                    resultBox.innerHTML = `
                        <div class="font-bold text-base mb-1">تمت العملية بنجاح! 🎉</div>
                        <pre class="mt-2 text-xs overflow-x-auto bg-white p-3 rounded border border-emerald-100 text-slate-700">${JSON.stringify(resData.data, null, 2)}</pre>
                    `;
                } else {
                    resultBox.className = 'p-4 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-200';
                    resultBox.innerHTML = `<strong>خطأ:</strong> ${resData.message || 'فشل تنفيذ الطلب'}`;
                    fetchCaptcha(); // تجديد الكابتشا عند الخطأ
                }
            } catch (err) {
                resultBox.classList.remove('hidden');
                resultBox.className = 'p-4 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-200';
                resultBox.innerHTML = 'حدث خطأ أثناء الاتصال بالسيرفر الوسيط.';
                fetchCaptcha();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'استعلام عن التقرير';
            }
        });
    </script>
</body>
</html>
